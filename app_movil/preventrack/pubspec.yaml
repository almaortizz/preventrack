name: preventrack
description: "Sistema de Preventa y Distribución."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.0
  provider: ^6.1.0
  intl: ^0.20.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  sqflite: ^2.4.4
  path: ^1.9.1
  url_launcher: ^6.3.2

  # Impresión Bluetooth (reemplaza a blue_thermal_printer)
  print_bluetooth_thermal: ^1.2.5
  esc_pos_utils_plus: ^2.0.4
  image: ^4.0.17
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

# Ícono de la app (logo de Bella Luz sobre fondo blanco).
# Para regenerarlo después de cambiar el logo: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  # Android moderno: ícono adaptable (el celular lo recorta en círculo/cuadro)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 16
  # iOS no permite transparencia: se rellena con blanco
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
